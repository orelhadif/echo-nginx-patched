# Custom configuration mounted read-only into BOTH images at /etc/nginx/conf.d
# (replacing the packaged default.conf), the way users of the image do it.

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # gzip goes through zlib: Debian 1.2.13 (orig) vs our 1.4 (new)
    gzip on;
    gzip_types *;
    gzip_min_length 1;

    location = /hello {
        add_header X-Custom "drop-in" always;
        return 200 "hello from custom config\n";
    }

    location = /json {
        default_type application/json;
        return 200 '{"ok":true,"server":"$server_name"}';
    }

    location /old/ {
        rewrite ^/old/(.*)$ /new/$1 permanent;
    }

    # regex location with a named capture: exercises PCRE2
    location ~ ^/re/(?<id>[0-9]+)$ {
        return 200 "regex id=$id\n";
    }

    location /try/ {
        try_files $uri $uri/ /index.html;
    }

    location = /upload {
        client_max_body_size 10m;
        return 201 "accepted\n";
    }
}

# TLS (default server for the port): certificate generated by the test run
server {
    listen       8443 ssl;
    server_name  a.test;
    ssl_certificate      /etc/nginx/certs/server.crt;
    ssl_certificate_key  /etc/nginx/certs/server.key;

    location / {
        return 200 "tls ok sni=$ssl_server_name proto=$ssl_protocol\n";
    }
}

# mutual TLS: the code path touched by the CVE-2025-23419 backport.
# A normal full handshake must behave exactly like the original.
server {
    listen       8444 ssl;
    server_name  a.test;
    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_client_certificate  /etc/nginx/certs/ca.crt;
    ssl_verify_client       on;

    location / {
        return 200 "mtls ok verify=$ssl_client_verify dn=$ssl_client_s_dn\n";
    }
}
