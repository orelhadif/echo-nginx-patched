# Full nginx.conf mounted into BOTH images: loads the njs dynamic module
# (built from source by us) and receives large request bodies.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    js_path   /etc/nginx/njs/;
    js_import main from main.js;

    server {
        listen 80;

        location = /njs/hello {
            js_content main.hello;
        }

        # whole body kept in memory so njs can hash it
        location = /njs/echo {
            client_max_body_size     10m;
            client_body_buffer_size  10m;
            js_content main.echo;
        }
    }
}
